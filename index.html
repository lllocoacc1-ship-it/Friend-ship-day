<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Friendship Day ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#6a11cb,#2575fc);
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
}

.container{
z-index:10;
padding:20px;
}

h1{
font-size:3rem;
animation:glow 2s infinite alternate;
}

p{
font-size:1.2rem;
margin-top:15px;
display:none;
}

button{
margin-top:30px;
padding:15px 35px;
font-size:20px;
border:none;
border-radius:50px;
background:#fff;
color:#2575fc;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

.balloon{
position:absolute;
bottom:-150px;
width:40px;
height:55px;
border-radius:50%;
animation:float linear infinite;
}

.balloon:after{
content:"";
position:absolute;
width:2px;
height:40px;
background:white;
left:50%;
top:55px;
}

@keyframes float{
0%{transform:translateY(0);}
100%{transform:translateY(-120vh);}
}

@keyframes glow{
from{text-shadow:0 0 10px white;}
to{text-shadow:0 0 25px yellow;}
}

.confetti{
position:absolute;
width:10px;
height:10px;
animation:fall 4s linear forwards;
}

@keyframes fall{
0%{
transform:translateY(-100px) rotate(0deg);
}
100%{
transform:translateY(120vh) rotate(720deg);
}
}
</style>

</head>
<body>

<div class="container">

<h1>💙 Happy Friendship Day 💙</h1>

<button onclick="celebrate()">🎁 Tap Here</button>

<p id="msg">
❤️ Thank you for always being there.<br><br>
You're the best friend anyone could ask for! 🫶<br><br>
<b>— From Om 💙</b>
</p>

</div>

<script>

const colors=[
"#ff4d6d",
"#ffd93d",
"#6bcB77",
"#4d96ff",
"#ff6b6b",
"#f72585"
];

for(let i=0;i<20;i++){

let b=document.createElement("div");
b.className="balloon";

b.style.left=Math.random()*100+"vw";
b.style.background=colors[Math.floor(Math.random()*colors.length)];

b.style.animationDuration=(6+Math.random()*5)+"s";
b.style.animationDelay=(Math.random()*5)+"s";

document.body.appendChild(b);

}

function celebrate(){

document.querySelector("button").style.display="none";

document.getElementById("msg").style.display="block";

for(let i=0;i<250;i++){

let c=document.createElement("div");

c.className="confetti";

c.style.left=Math.random()*100+"vw";

c.style.top="-20px";

c.style.background=colors[Math.floor(Math.random()*colors.length)];

c.style.animationDuration=(2+Math.random()*2)+"s";

document.body.appendChild(c);

setTimeout(()=>{
c.remove();
},4000);

}

}
</script>

</body>
</html>
