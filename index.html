<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>💖 Happy Friendship Day Kaju Katli 🌸</title>
<style>body{margin:0;font-family:Arial;background:linear-gradient(135deg,#ffd6ea,#e8d5ff);overflow:hidden;color:#fff}#loading,#welcome{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center}#welcome{display:none}button{padding:14px 26px;border-radius:30px;border:none;font-size:18px}.heart{position:absolute;animation:f 8s linear infinite}@keyframes f{from{transform:translateY(110vh)}to{transform:translateY(-10vh)}}</style></head><body>
<div id='loading'><h1>💖 Preparing something special... ✨</h1></div>
<div id='welcome'><h1>Happy Friendship Day 💖</h1><h2>Kaju Katli 🌸</h2><button id='open'>🎁 Open Your Surprise</button><audio id='bg' loop><source src='music.mp3' type='audio/mpeg'></audio></div>
<script>
for(let i=0;i<40;i++){let h=document.createElement('div');h.className='heart';h.innerHTML='💖';h.style.left=Math.random()*100+'vw';h.style.fontSize=(18+Math.random()*18)+'px';h.style.animationDuration=(5+Math.random()*5)+'s';document.body.appendChild(h);}
setTimeout(()=>{loading.style.display='none';welcome.style.display='flex';},2000);
open.onclick=()=>{let a=bg;a.volume=.2;a.play().catch(()=>{});let v=.2;let t=setInterval(()=>{v+=.05;if(v>=1){v=1;clearInterval(t)}a.volume=v;},300);alert('Part 2 me Gift Animation + Letter add hoga ❤️');};
document.addEventListener('visibilitychange',()=>{document.title=document.hidden?'🥺 Arre Kaju Katli... wapas aa jao, surprise abhi baaki hai! 💖':'💖 Happy Friendship Day Kaju Katli 🌸';});
</script></body></html>
